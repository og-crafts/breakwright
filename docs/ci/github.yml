# Example: fail a pull request when tests stop noticing faults. Adjust paths.
name: proof
on: pull_request
permissions: { contents: read }
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: node tools/breakwright/cli.mjs audit . --fail
      - run: node tools/breakwright/cli.mjs faults . tests/checkout.spec.ts --min-caught 60 --json proof.json
